name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  # attestations: write

env:
  IMAGE_NAME: rahulkishorparida/employee-service

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build JAR
        run: ./mvnw clean package -DskipTests

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        id: build
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:v3
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Scan Docker Image with Trivy
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Docker Image
        if: github.event_name == 'push'
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Checkout GitOps repo
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          repository: rahulkishorparida/employee-service-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: employee-service-gitops   

      - name: Update GitOps image tag
        if: github.event_name == 'push'
        working-directory: employee-service-gitops
        run: |
          sed -i "s/^  tag: .*/  tag: \"${{ github.sha }}\"/" \
          helm/employee-service/values.yaml 

      - name: Commit & Push Changes
        if: github.event_name == 'push'
        working-directory: employee-service-gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/employee-service/values.yaml
          git commit -m "Update employee-service image to ${{ github.sha }}"
          git push    

          

      # - name: Generate SLSA Provenance
      #   if: github.event_name == 'push'
      #   uses: actions/attest-build-provenance@v2
      #   with:
      #     subject-name: ${{ env.IMAGE_NAME }}
      #     subject-digest: ${{ steps.build.outputs.digest }}
      #     push-to-registry: true


