name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: rahulkishorparida/employee-service

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout application source code
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 3. Static code security analysis
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1

      # 4. Scan repository for leaked secrets
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

      # 5. Build Docker image
      # Dockerfile Stage 1 builds the JAR
      # Dockerfile Stage 2 creates the runtime image
      - name: Build Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:v3
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 6. Scan Docker image for vulnerabilities
      - name: Scan Docker Image with Trivy
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # 7. Login to Docker Hub
      # Runs only after Trivy succeeds
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 8. Push Docker image
      - name: Push Docker Image
        if: github.event_name == 'push'
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 9. Install Cosign
      - name: Install Cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      # 10. Sign Docker image
      - name: Sign Docker Image
        if: github.event_name == 'push'
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 11. Checkout GitOps repository
      - name: Checkout GitOps repo
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          repository: rahulkishorparida/employee-service-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: employee-service-gitops

      # 12. Update image tag in GitOps repository
      - name: Update GitOps image tag
        if: github.event_name == 'push'
        working-directory: employee-service-gitops
        run: |
          sed -i "s/^  tag: .*/  tag: \"${{ github.sha }}\"/" \
            helm/employee-service/values.yaml

      # 13. Commit and push GitOps change
      - name: Commit & Push Changes
        if: github.event_name == 'push'
        working-directory: employee-service-gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/employee-service/values.yaml
          git commit -m "Update employee-service image to ${{ github.sha }}"
          git push 

          

